<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOSS EXAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { background-color: #020617; } 
        
        .option-btn {
            background-color: #1e293b;
            border: 2px solid #334155;
            color: #f1f5f9;
            transition: all 0.15s ease;
        }
        .option-btn:active {
            transform: scale(0.98);
            background-color: #334155;
        }

        .btn-correct { background-color: #14532d !important; border-color: #22c55e !important; }
        .btn-wrong { background-color: #7f1d1d !important; border-color: #ef4444 !important; }
        
        #vfx-layer { pointer-events: none; z-index: 50; }
        #quizModal { z-index: 100; }
    </style>
</head>
<body class="text-white font-sans h-screen w-screen overflow-hidden flex flex-col">

    <div id="vfx-layer" class="fixed inset-0 flex items-center justify-center">
        <svg id="sword-slash" class="absolute w-full h-full opacity-0" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M-10,110 L110,-10" stroke="white" stroke-width="2" fill="none" filter="drop-shadow(0 0 10px cyan)" />
        </svg>
        <svg id="demon-claw" class="absolute w-64 h-64 opacity-0" viewBox="0 0 100 100">
            <path d="M10,10 Q50,50 90,90" stroke="#ef4444" stroke-width="8" fill="none" stroke-linecap="round" />
            <path d="M20,5 Q60,45 100,85" stroke="#ef4444" stroke-width="8" fill="none" stroke-linecap="round" />
        </svg>
    </div>

    <div id="quizModal" class="fixed inset-0 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center px-4">
        <div class="bg-slate-900 border-2 border-yellow-600 rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl">
            <div id="modalIcon" class="text-5xl mb-4">👑</div>
            <h3 id="modalTitle" class="text-xl font-black text-yellow-400 mb-2 uppercase">JUDUL</h3>
            <p id="modalMessage" class="text-slate-300 text-sm mb-6">Pesan modal.</p>
            <button onclick="closeModal()" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 rounded-xl transition-colors">
                LANJUT
            </button>
        </div>
    </div>

    <div class="shrink-0 px-6 pt-6 pb-2 flex justify-between items-center bg-slate-950 z-10">
        <div class="px-3 py-1 bg-red-900/50 border border-red-500 rounded-full text-[10px] text-red-200 font-bold tracking-widest animate-pulse">
            DUNGEON BATTLE
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-500 uppercase">Score</p>
            <h3 id="scoreDisplay" class="text-2xl font-black text-yellow-400 leading-none">0</h3>
        </div>
    </div>

    <div class="shrink-0 px-6 w-full z-10 mb-2">
        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
            <div id="quiz-progress" class="bg-yellow-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <p id="counter" class="text-right text-[10px] text-slate-500 mt-1">Loading...</p>
    </div>

    <div class="flex-1 overflow-y-auto px-4 pb-10 z-10">
        <div class="w-full max-w-md mx-auto flex flex-col gap-4 min-h-full justify-center">
            
            <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl text-center shadow-lg relative overflow-hidden shrink-0 min-h-[160px] flex flex-col justify-center items-center">
                <div class="absolute top-0 left-0 w-full h-1 bg-yellow-500"></div>
                <p id="question-label" class="text-[10px] text-yellow-500 mb-2 uppercase tracking-[0.2em] font-bold">PERTANYAAN</p>
                
                <h1 id="quiz-question" class="text-6xl font-black text-white drop-shadow-lg leading-tight">?</h1>
            </div>

            <div id="quiz-options" class="flex flex-col gap-3 shrink-0">
                </div>

        </div>
    </div>

    <script>
        let kanjiData = [];
        let quizQuestions = [];
        let currentQuizIndex = 0;
        let quizScore = 0;
        let onModalClose = null;
        let player = JSON.parse(localStorage.getItem('rpgKanjiPlayer')) || { learnedKanji: [], xp: 0 };

        window.onload = async () => {
            await fetchKanjiData();
            generateQuestions();
        };

        async function fetchKanjiData() {
            try {
                const res = await fetch('/api/kanji');
                const json = await res.json();
                if(json.success) kanjiData = json.data;
            } catch (e) { 
                showModal("Error", "Gagal koneksi server.", "❌", () => window.location.href='/');
            }
        }

        function generateQuestions() {
            const learned = player.learnedKanji;
            if (!learned || learned.length === 0) { 
                showModal("Info", "Belum ada data kanji.", "ℹ️", () => window.location.href='/'); 
                return; 
            }
            
            const startIndex = Math.max(0, learned.length - 10);
            const examIds = learned.slice(startIndex, learned.length);
            const examData = kanjiData.filter(k => examIds.includes(k.id));

            if(examData.length === 0) {
                showModal("Error", "Data corrupt.", "⚠️", () => window.location.href='/');
                return;
            }

            // === SHUFFLE LOGIC (CHAOS MODE) ===
            quizQuestions = examData.map(item => {
                const others = kanjiData.filter(k => k.id !== item.id);
                const distractors = others.sort(() => 0.5 - Math.random()).slice(0, 3);
                while(distractors.length < 3 && others.length > 0) distractors.push(others[0]); // Fallback

                // Acak Tipe Soal (0: Arti, 1: Kanji, 2: Bacaan, 3: Kanji dr Bacaan)
                const questionType = Math.floor(Math.random() * 4); 
                
                let questionObj = {
                    type: questionType, 
                    label: "",
                    question: "",
                    options: []
                };

                // CONFIG SOAL BERDASARKAN TIPE
                if (questionType === 0) {
                    // Tipe: Lihat Kanji -> Tebak Arti
                    questionObj.label = "APA ARTINYA?";
                    questionObj.question = item.kanji;
                    questionObj.isKanjiQuestion = true; // Flag untuk font size
                    questionObj.options = [
                        { text: item.meaning, isCorrect: true },
                        ...distractors.map(d => ({ text: d.meaning, isCorrect: false }))
                    ];
                } 
                else if (questionType === 1) {
                    // Tipe: Lihat Arti -> Tebak Kanji
                    questionObj.label = "KANJI DARI";
                    questionObj.question = item.meaning;
                    questionObj.isKanjiQuestion = false;
                    questionObj.options = [
                        { text: item.kanji, isCorrect: true, isKanji: true },
                        ...distractors.map(d => ({ text: d.kanji, isCorrect: false, isKanji: true }))
                    ];
                }
                else if (questionType === 2) {
                    // Tipe: Lihat Kanji -> Tebak Bacaan
                    questionObj.label = "CARA BACA KANJI BERIKUT";
                    questionObj.question = item.kanji;
                    questionObj.isKanjiQuestion = true;
                    questionObj.options = [
                        { text: `${item.onyomi} / ${item.kunyomi}`, isCorrect: true },
                        ...distractors.map(d => ({ text: `${d.onyomi} / ${d.kunyomi}`, isCorrect: false }))
                    ];
                }
                else {
                    // Tipe: Lihat Bacaan -> Tebak Kanji
                    questionObj.label = "KANJI DARI";
                    questionObj.question = `${item.onyomi} / ${item.kunyomi}`;
                    questionObj.isKanjiQuestion = false;
                    questionObj.options = [
                        { text: item.kanji, isCorrect: true, isKanji: true },
                        ...distractors.map(d => ({ text: d.kanji, isCorrect: false, isKanji: true }))
                    ];
                }

                // Acak posisi jawaban
                questionObj.options.sort(() => 0.5 - Math.random());
                return questionObj;
            });

            quizQuestions.sort(() => 0.5 - Math.random());
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQuizIndex >= quizQuestions.length) {
                finishQuiz();
                return;
            }

            const q = quizQuestions[currentQuizIndex];
            const questionEl = document.getElementById('quiz-question');
            
            // 1. Update Texts
            document.getElementById('question-label').innerText = q.label;
            questionEl.innerText = q.question;
            document.getElementById('counter').innerText = `Soal ${currentQuizIndex + 1} / ${quizQuestions.length}`;
            
            // 2. Dynamic Font Size (Agar Text Panjang muat di Mobile)
            if (q.isKanjiQuestion) {
                questionEl.className = "text-7xl font-black text-white drop-shadow-lg leading-tight"; // Besar untuk Kanji
            } else {
                // Cek panjang teks soal
                const len = q.question.length;
                if(len > 20) questionEl.className = "text-2xl font-bold text-white leading-snug px-2";
                else if(len > 10) questionEl.className = "text-3xl font-black text-white leading-snug";
                else questionEl.className = "text-4xl font-black text-white leading-tight";
            }

            // 3. Progress Bar
            const pct = (currentQuizIndex / quizQuestions.length) * 100;
            document.getElementById('quiz-progress').style.width = `${pct}%`;

            // 4. Render Options
            const optsDiv = document.getElementById('quiz-options');
            optsDiv.innerHTML = ''; 

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                // Styling berbeda jika opsi adalah Kanji (lebih besar)
                const fontSize = opt.isKanji ? "text-3xl" : "text-sm font-bold";
                
                btn.className = `option-btn w-full py-4 px-4 rounded-xl shadow-md flex items-center justify-center min-h-[64px] ${fontSize}`;
                btn.innerText = opt.text;
                btn.onclick = () => handleAnswer(opt.isCorrect, btn);
                
                optsDiv.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                quizScore += 10;
                btnElement.classList.add('btn-correct');
                triggerSlash();
            } else {
                btnElement.classList.add('btn-wrong');
                
                // Cari jawaban benar untuk Feedback
                // Kita cari berdasarkan teks opsi yang benar di data soal saat ini
                const q = quizQuestions[currentQuizIndex];
                const correctOption = q.options.find(o => o.isCorrect);
                
                allBtns.forEach(b => {
                    if (b.innerText === correctOption.text) b.classList.add('btn-correct');
                });

                triggerDamage();
            }

            const scoreEl = document.getElementById('scoreDisplay');
            scoreEl.innerText = quizScore;
            gsap.to(scoreEl, { scale: 1.3, duration: 0.1, yoyo: true, repeat: 1 });

            setTimeout(() => {
                currentQuizIndex++;
                renderQuestion();
            }, 1200); // Delay sedikit lebih lama agar user bisa lihat jawaban benar
        }

        // --- VFX ---
        function triggerSlash() {
            const slash = document.getElementById('sword-slash');
            gsap.fromTo(slash, {opacity: 1, scale: 0.5, rotation: -45}, {opacity: 0, scale: 1.5, rotation: 0, duration: 0.3});
            gsap.to("body", { backgroundColor: "#064e3b", duration: 0.1, yoyo: true, repeat: 1, onComplete: () => gsap.set("body", {backgroundColor: "#020617"}) });
        }

        function triggerDamage() {
            const claw = document.getElementById('demon-claw');
            gsap.fromTo(claw, {opacity: 1, scale: 2, rotation: -20}, {opacity: 0, scale: 1, rotation: 0, duration: 0.4});
            gsap.to("body", { backgroundColor: "#7f1d1d", duration: 0.1, yoyo: true, repeat: 1, onComplete: () => gsap.set("body", {backgroundColor: "#020617"}) });
            gsap.to("body", { x: 10, duration: 0.05, yoyo: true, repeat: 5 });
        }

        // --- MODAL ---
        function showModal(title, message, icon, callback) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalIcon').innerText = icon;
            onModalClose = callback;
            
            const modal = document.getElementById('quizModal');
            modal.classList.remove('hidden');
            gsap.fromTo(modal.firstElementChild, {scale: 0.8, opacity: 0}, {scale: 1, opacity: 1, duration: 0.3, ease: "back.out"});
        }

        function closeModal() {
            const modal = document.getElementById('quizModal');
            modal.classList.add('hidden');
            if (onModalClose) {
                onModalClose();
                onModalClose = null;
            }
        }

        function finishQuiz() {
            document.getElementById('quiz-progress').style.width = `100%`;
            const passingScore = 90;

            setTimeout(() => {
                if (quizScore >= passingScore) {
                    if(quizScore === 100) player.xp += 50;
                    
                    const count = player.learnedKanji.length;
                    if (count >= 90) player.currentRank = "God Tier";
                    else if (count >= 60) player.currentRank = "Master";
                    else if (count >= 30) player.currentRank = "Adept";
                    else if (count >= 10) player.currentRank = "Rookie";
                    else player.currentRank = "Apprentice";

                    showModal("Victory! 🎉", `Skor: ${quizScore}. Yourr Rank: ${player.currentRank}!`, "👑", () => {
                        localStorage.setItem('rpgKanjiPlayer', JSON.stringify(player));
                        window.location.href = '/';
                    });
                } else {
                    const penalty = 50;
                    player.xp = Math.max(0, player.xp - penalty);
                    const kanjiToRemove = 10; 
                    if (player.learnedKanji.length >= kanjiToRemove) {
                        player.learnedKanji.splice(-kanjiToRemove); 
                    } else {
                        player.learnedKanji = []; // Reset total jika data < 10
                    }
                    const count = player.learnedKanji.length;
                    if (count < 10) player.currentRank = "Apprentice";
                    else if (count < 30) player.currentRank = "Rookie";
                    showModal("Defeat 💀", `Skor kamu : ${quizScore} XP Kamu  -${penalty}.`, "", () => {
                        localStorage.setItem('rpgKanjiPlayer', JSON.stringify(player));
                        window.location.href = '/';
                    });
                }
            }, 500);
        }
    
    </script>
</body>
</html>
