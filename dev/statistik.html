<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Stats - Kanji RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-white font-sans min-h-screen py-8 px-4">

    <!-- Ambient Background Effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute top-20 left-20 w-96 h-96 bg-blue-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-purple-600/20 blur-[120px] rounded-full"></div>
    </div>

    <div class="max-w-4xl mx-auto relative">
        <!-- Header -->
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-400 to-green-400 drop-shadow-[0_0_30px_rgba(59,130,246,0.5)]">
                    PLAYER STATUS
                </h1>
                <p class="text-slate-500 text-sm mt-2 font-semibold tracking-wide">🎮 Your Journey Progress</p>
            </div>
            <a href="/" class="group bg-slate-800/80 backdrop-blur-sm hover:bg-slate-700 px-5 py-3 rounded-xl text-sm font-bold text-slate-200 transition-all duration-300 border border-slate-700/50 hover:border-purple-500/50 shadow-lg hover:shadow-purple-500/20 flex items-center gap-2">
                <span class="group-hover:-translate-x-1 transition-transform duration-300">⬅</span>
                <span>Back to Game</span>
            </a>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="group relative bg-gradient-to-br from-slate-800/90 to-slate-900/90 backdrop-blur-sm p-5 rounded-2xl border border-slate-700/50 hover:border-blue-500/50 text-center transition-all duration-300 shadow-lg hover:shadow-blue-500/20 overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-blue-600/0 to-blue-600/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <span class="relative block text-slate-400 text-[10px] uppercase tracking-widest font-bold mb-2">Total XP</span>
                <h2 id="statXP" class="relative text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">0</h2>
            </div>
            
            <div class="group relative bg-gradient-to-br from-slate-800/90 to-slate-900/90 backdrop-blur-sm p-5 rounded-2xl border border-slate-700/50 hover:border-green-500/50 text-center transition-all duration-300 shadow-lg hover:shadow-green-500/20 overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-green-600/0 to-green-600/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <span class="relative block text-slate-400 text-[10px] uppercase tracking-widest font-bold mb-2">Kanji Mastered</span>
                <h2 id="statCount" class="relative text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-400">0/100</h2>
            </div>
            
            <div class="group relative bg-gradient-to-br from-slate-800/90 to-slate-900/90 backdrop-blur-sm p-5 rounded-2xl border border-slate-700/50 hover:border-yellow-500/50 text-center transition-all duration-300 shadow-lg hover:shadow-yellow-500/20 overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-yellow-600/0 to-yellow-600/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <span class="relative block text-slate-400 text-[10px] uppercase tracking-widest font-bold mb-2">Current Rank</span>
                <h2 id="statRank" class="relative text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-400">-</h2>
            </div>
            
            <div class="group relative bg-gradient-to-br from-slate-800/90 to-slate-900/90 backdrop-blur-sm p-5 rounded-2xl border border-slate-700/50 hover:border-red-500/50 text-center transition-all duration-300 shadow-lg hover:shadow-red-500/20 overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-red-600/0 to-red-600/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <span class="relative block text-slate-400 text-[10px] uppercase tracking-widest font-bold mb-2">Boss Access</span>
                <h2 id="statBoss" class="relative text-xl font-black text-red-500">LOCKED</h2>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="bg-gradient-to-br from-slate-800/80 to-slate-900/80 backdrop-blur-sm p-8 rounded-3xl border border-slate-700/50 shadow-2xl mb-8">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-black text-white">Mastery Progress</h3>
                <span class="text-slate-500 text-xs font-mono">📈 Overall Performance</span>
            </div>
            <div id="chart"></div>
        </div>
        
        <!-- Reset Button -->
        <div class="text-center">
            <button onclick="showResetModal()" class="group relative inline-flex items-center gap-2 px-6 py-3 bg-slate-800/50 backdrop-blur-sm border border-red-900/50 rounded-xl text-red-400 text-sm font-bold hover:bg-red-900/20 hover:border-red-500/50 transition-all duration-300 shadow-lg hover:shadow-red-500/20">
                <span class="text-lg group-hover:rotate-12 transition-transform duration-300">⚠️</span>
                <span>Reset All Progress</span>
            </button>
        </div>
    </div>

    <!-- Custom Reset Modal -->
    <div id="resetModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-red-500/30 rounded-2xl max-w-md w-full p-8 shadow-2xl shadow-red-500/20 transform scale-95 animate-scale-in">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-red-500/20 rounded-full mb-4 animate-pulse">
                    <span class="text-4xl">⚠️</span>
                </div>
                <h3 class="text-2xl font-black text-white mb-2">WARNING!</h3>
                <p class="text-slate-400 text-sm leading-relaxed">Apakah kamu yakin ingin menghapus <span class="text-red-400 font-bold">semua progress</span>? Tindakan ini tidak dapat dibatalkan!</p>
            </div>
            
            <div class="flex gap-3">
                <button onclick="closeResetModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all duration-300 active:scale-95">
                    Cancel
                </button>
                <button onclick="confirmReset()" class="flex-1 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-bold py-3 rounded-xl transition-all duration-300 shadow-lg shadow-red-500/30 active:scale-95">
                    Yes, Reset
                </button>
            </div>
        </div>
    </div>

    <style>
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scale-in {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.2s ease-out;
        }
        .animate-scale-in {
            animation: scale-in 0.3s ease-out;
        }
    </style>

    <script>
        // Load Data
        const player = JSON.parse(localStorage.getItem('rpgKanjiPlayer')) || { learnedKanji: [], xp: 0, currentRank: "Apprentice" };

        // Populate Text Stats
        document.getElementById('statXP').innerText = player.xp;
        document.getElementById('statCount').innerText = player.learnedKanji.length;
        document.getElementById('statRank').innerText = player.currentRank;
        
        if(player.currentRank === "God Tier") {
            document.getElementById('statBoss').innerText = "UNLOCKED";
            document.getElementById('statBoss').classList.remove("text-red-500");
            document.getElementById('statBoss').classList.add("text-transparent", "bg-clip-text", "bg-gradient-to-r", "from-green-400", "to-emerald-400");
        }

        // ApexCharts Config
        const options = {
            series: [player.learnedKanji.length],
            chart: {
                height: 350,
                type: 'radialBar',
                background: 'transparent'
            },
            plotOptions: {
                radialBar: {
                    startAngle: -135,
                    endAngle: 135,
                    hollow: {
                        margin: 15,
                        size: '70%',
                        background: 'transparent',
                    },
                    track: {
                        background: '#1e293b',
                        strokeWidth: '100%',
                    },
                    dataLabels: {
                        show: true,
                        name: {
                            offsetY: -10,
                            show: true,
                            color: '#94a3b8',
                            fontSize: '14px',
                            fontWeight: 'bold'
                        },
                        value: {
                            offsetY: 10,
                            color: '#fff',
                            fontSize: '42px',
                            fontWeight: 'black',
                            show: true,
                        }
                    }
                }
            },
            fill: {
                type: 'gradient',
                gradient: {
                    shade: 'dark',
                    type: 'horizontal',
                    shadeIntensity: 0.5,
                    gradientToColors: ['#34D399'],
                    inverseColors: true,
                    opacityFrom: 1,
                    opacityTo: 1,
                    stops: [0, 100]
                }
            },
            stroke: {
                lineCap: 'round'
            },
            labels: ['Completion'],
            colors: ['#3B82F6']
        };

        const chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();

        // Modal Functions
        function showResetModal() {
            document.getElementById('resetModal').classList.remove('hidden');
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.add('hidden');
        }

        function confirmReset() {
            localStorage.removeItem('rpgKanjiPlayer');
            window.location.reload();
        }
    </script>
</body>
</html>
